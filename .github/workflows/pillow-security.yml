name: Pillow security regression
on:
  push:
    paths:
      - 'pyproject.toml'
      - 'requirements.txt'
      - 'config/requirements_core.txt'
      - 'tests/test_pillow_security.py'
      - '.github/workflows/pillow-security.yml'
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: read

jobs:
  pillow:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install secure Pillow
        run: python -m pip install 'Pillow>=13.0.0,<14'
      - name: Verify requirements and basic image operations
        run: python -m unittest discover -s tests -p test_pillow_security.py -v
